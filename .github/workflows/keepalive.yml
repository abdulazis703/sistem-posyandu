name: Supabase Keepalive
on:
  schedule:
    - cron: "0 2 */3 * *"   # tiap 3 hari
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query database
        run: |
          curl -f -s "${{ secrets.SUPABASE_URL }}/rest/v1/posyandus?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"